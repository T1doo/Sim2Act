name: Windows Server native MOCK engineering

on:
  push:
    branches: [dev/f1-foundation, dev/production-trial-stages-20261018, dev/cloud-g0-live-20261028]
    paths:
      - .gitattributes
      - .github/workflows/windows-native-mock.yml
      - src/**
      - scripts/**
      - tests/**
      - requirements.lock
      - requirements-windows.lock
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/dev/cloud-g0-live-20261028' && format('sim2act-windows-desktop-once-{0}', github.sha) || format('sim2act-windows-mock-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  desktop-recovery-once:
    if: >-
      github.repository == 'T1doo/Sim2Act' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/dev/cloud-g0-live-20261028' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[desktop-recovery-once-20261030]')
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SIM2ACT_MODEL_MODE: mock
      SIM2ACT_LIVE_ENABLED: 'false'
      SIM2ACT_MODEL: intern-s2
      SIM2ACT_INTERN_TOKEN: ''
      INTERN_API_TOKEN: ''
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_PATH: ${{ github.workspace }}/scripts/browser-ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /pyproject.toml
            /setup.py
            /README.md
            /.env.example
            /requirements.lock
            /requirements-windows.lock
            /src/
            /scripts/
            /tests/
            /schemas/
            /docs/evidence/bounded-agent-offline-20261006/independent-gold.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/a-source.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/a-cold.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/b-source.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/b-cold.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 1
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Existing locked dependencies and native source build, no cache or browser install
        id: install
        timeout-minutes: 4
        run: |
          python -c "from pathlib import Path; import json,subprocess; root=Path('src/sim2act'); names=set(json.loads((root/'production_software_qualification.json').read_text())['files']) | {'production_software_qualification.json','text_software_anchors.json','text_software_qualification.json','web/app.css','web/index.html','web/internal.js','web/use.js'}; bad=[n for n in sorted(names) if (root/n).read_bytes()!=subprocess.check_output(['git','show','HEAD:'+(root/n).as_posix()])]; assert not bad, ('Checkout changed exact Git bytes',bad); print('Exact Git checkout bytes preserved: '+str(len(names)))"
          if ($LASTEXITCODE -ne 0) { throw 'Checkout byte mismatch; no rewrite or qualification bypass.' }
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --retries 0 --timeout 30 -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency install failed; no alternate source.' }
          ./.venv/Scripts/python.exe -m pip install --no-index --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Exact source build failed.' }
          ./.venv/Scripts/python.exe -c "from sim2act import _raw_snapshot, _cold_graph_structure; from sim2act.production_trial_admission import _qualified; _qualified(); print('Both native extensions imported; full qualification checked')"
          if ($LASTEXITCODE -ne 0) { throw 'Required native imports or qualification failed.' }
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(!((a===22&&(b>22||(b===22&&c>=2)))||(a===24&&b>=15)||a>=26))throw Error('Existing Node does not meet locked jsdom engines; no runtime installer');console.log('Existing compatible Node '+process.versions.node)"
          if ($LASTEXITCODE -ne 0) { throw 'Existing Node incompatible; no replacement runtime.' }
          npm ci --prefix scripts/browser-ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --cache "$env:RUNNER_TEMP/sim2act-npm-cache" --fetch-retries=0 --fetch-timeout=30000
          if ($LASTEXITCODE -ne 0) { throw 'Locked Node dependency install failed; no browser download.' }
      - name: Protected installed Edge, actual stable-origin restart and workspace pixels
        timeout-minutes: 4
        run: |
          $Edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          $Signature = Get-AuthenticodeSignature -LiteralPath $Edge
          if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Existing signed Edge unavailable; no installer/fallback.' }
          ./.venv/Scripts/python.exe scripts/windows_desktop_flow_ci.py --root "$env:RUNNER_TEMP/sim2act-desktop-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Actual protected Edge flow failed; preserve log evidence.' }
      - name: Native bounded recovery, cancellation, application use and exact export regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          ./.venv/Scripts/python.exe -m pytest --assert=plain tests/test_desktop_origin.py tests/test_desktop_control.py tests/test_application_use.py tests/test_csv_run_download.py tests/test_engineering_workspace.py -q --basetemp="$env:RUNNER_TEMP/sim2act-regression-$env:GITHUB_RUN_ID" --junitxml="$env:RUNNER_TEMP/sim2act-regression.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Finite native regression failed; no retry or skipped failure.' }
      - name: Preserve boundary and actual test summary, no retained artifact/cache upload
        if: always()
        run: |
          'Windows Server 2025 / protected installed Edge; Windows 11 and native EXE/WebView2 acceptance NOT_RUN. Synthetic fixed Mock definition only; no live provider. Standard public runner, no artifact/cache upload.' | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:RUNNER_TEMP/sim2act-regression.xml") { Get-Content "$env:RUNNER_TEMP/sim2act-regression.xml" -Raw }

  native-mock:
    if: github.ref == 'refs/heads/dev/f1-foundation'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SIM2ACT_MODEL_MODE: mock
      SIM2ACT_LIVE_ENABLED: 'false'
      SIM2ACT_MODEL: intern-s2
      SIM2ACT_INTERN_TOKEN: ''
      INTERN_API_TOKEN: ''
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Checkout authorized development commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Python 3.12 x64 (no Actions cache)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Native runner context, temporary PostgreSQL, existing Setup
        run: ./scripts/WindowsCI.ps1 -Phase Setup
      - name: Small native API-worker-PowerShell smoke with application role
        run: ./.venv/Scripts/python.exe scripts/windows_ci_smoke.py
      - name: Engineering or explicitly marked remaining11 diagnostics
        run: |
          # Only an explicit diagnostic commit requests the fixed remaining11 scope.
          # Default engineering remains full; neither mode accepts Windows11/R0.
          $Remaining11 = '${{ contains(github.event.head_commit.message, '[native-remaining11]') }}' -eq 'true'
          ./scripts/WindowsCI.ps1 -Phase Test -Remaining11:$Remaining11
      - name: Protected installed Edge real internal UI (synthetic, same runner)
        timeout-minutes: 4
        run: ./scripts/WindowsBrowserCI.ps1
      - name: Report actual test counts (no artifact upload)
        if: always()
        run: ./scripts/WindowsCI.ps1 -Phase Report
      - name: Stop owned API-worker and temporary PostgreSQL
        if: always()
        run: ./scripts/WindowsCI.ps1 -Phase Cleanup

  source-review-ui-once:
    if: >-
      github.repository == 'T1doo/Sim2Act' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/dev/production-trial-stages-20261018' &&
      github.run_attempt == 1 &&
      (contains(github.event.head_commit.message, '[source-review-ui-once-20261022]') ||
       contains(github.event.head_commit.message, '[review-readback-ui-once-20261022]') ||
       contains(github.event.head_commit.message, '[completion-readback-ui-once-20261022]') ||
       contains(github.event.head_commit.message, '[workspace-visual-once-20261022]') ||
       contains(github.event.head_commit.message, '[workspace-density-once-20261022]') ||
       contains(github.event.head_commit.message, '[catalog-visual-once-20261026]'))
    runs-on: windows-2025
    timeout-minutes: 4
    defaults:
      run:
        shell: pwsh
    env:
      SIM2ACT_MODEL_MODE: mock
      SIM2ACT_LIVE_ENABLED: 'false'
      SIM2ACT_INTERN_TOKEN: ''
      INTERN_API_TOKEN: ''
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Start the single 180-second work budget before setup
        timeout-minutes: 1
        run: |
          "SIM2ACT_UI_UNTIL=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() + 180000)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/windows-native-mock.yml
            /pyproject.toml
            /requirements-windows.lock
            /src/
            /scripts/OwnedBrowserSetup.ps1
            /scripts/WindowsExtractCompletionUI.ps1
            /scripts/protocol_completion_browser_ci.py
            /scripts/protocol_review_readback_fixture.py
            /scripts/protocol_completion_readback_fixture.py
            /scripts/windows_browser_ci.py
            /scripts/browser-ci/package.json
            /scripts/browser-ci/package-lock.json
            /scripts/browser-ci/extract-completion.cjs
            /scripts/catalog_visual_contract.py
            /scripts/browser-ci/catalog-visual.cjs
            /docs/evidence/catalog-four-frame-plan-20261026/before-assets/
            /docs/evidence/catalog-four-frame-wiring-20261026/execution.json
            /docs/evidence/catalog-four-frame-wiring-20261026/runtime-manifest.json
            /scripts/browser-ci/workspace-visual.cjs
            /scripts/readonly_content_fixture.py
            /docs/evidence/research-desk-content-20261023/saved-csv.json
            /docs/evidence/research-desk-content-20261023/saved-csv.sqlite.gz
            /docs/evidence/goal-history-visual-candidate-20261025/fixture.json
            /scripts/browser-ci/goal-history-state.cjs
            /docs/evidence/protocol-cold-review-http-20261022/fixture.json
            /docs/evidence/protocol-cold-review-http-20261022/MANIFEST.json
            /docs/evidence/protocol-cold-review-http-20261022/runtime/after.sqlite.gz
            /docs/evidence/protocol-cold-review-http-20261022/fixture/
            /docs/evidence/protocol-source-process-recovery-20261022/MANIFEST.json
            /docs/evidence/protocol-extract-process-recovery-20261022/MANIFEST.json
            /docs/evidence/protocol-extract-process-recovery-20261022/original.json
            /docs/evidence/protocol-extract-process-recovery-20261022/after.sqlite.gz
            /docs/evidence/protocol-extract-process-recovery-20261022/original-received-sidecar.json
            /docs/evidence/protocol-source-process-recovery-20261022/original.json
            /docs/evidence/protocol-source-process-recovery-20261022/after.sqlite.gz
            /docs/evidence/protocol-source-process-recovery-20261022/original-received-sidecar.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/a-source.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/a-cold.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/b-source.json
            /docs/evidence/protocol-store-loop-20261006/evaluation/b-cold.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 1
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Explicit sealed review action in protected installed Edge
        timeout-minutes: 4
        run: |
          $WorkspaceVisual = '${{ contains(github.event.head_commit.message, '[workspace-visual-once-20261022]') || contains(github.event.head_commit.message, '[workspace-density-once-20261022]') }}' -eq 'true'
          $Readback = '${{ contains(github.event.head_commit.message, '[review-readback-ui-once-20261022]') }}' -eq 'true'
          $CompletionReadback = '${{ contains(github.event.head_commit.message, '[completion-readback-ui-once-20261022]') }}' -eq 'true'
          $CatalogVisual = '${{ contains(github.event.head_commit.message, '[catalog-visual-once-20261026]') }}' -eq 'true'
          if ($CatalogVisual) { ./scripts/WindowsExtractCompletionUI.ps1 -CatalogVisual }
          elseif ($WorkspaceVisual) { ./scripts/WindowsExtractCompletionUI.ps1 -WorkspaceVisual }
          elseif ($CompletionReadback) { ./scripts/WindowsExtractCompletionUI.ps1 -CompletionReadback }
          elseif ($Readback) { ./scripts/WindowsExtractCompletionUI.ps1 -ReviewReadback }
          else { ./scripts/WindowsExtractCompletionUI.ps1 -SourceReview }
