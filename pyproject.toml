[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2act"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0", "sqlalchemy==2.0.48", "psycopg[binary]==3.3.3", "httpx==0.28.1", "pydantic==2.12.5", "psutil==7.2.2"]

[project.scripts]
sim2act = "sim2act.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sim2act = ["web/*", "text_software_anchors.json", "text_software_qualification.json", "production_software_qualification.json", "_owned_sql_catalog.json", "*.c"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
