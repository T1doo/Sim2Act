<style>*{box-sizing:border-box}body{margin:0;background:#0d1728;color:#e6efff;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1550px;margin:auto;padding:16px}header,nav{display:flex;align-items:center;gap:14px}header{justify-content:space-between}h1{font-size:22px;margin:0}small{color:#b5c6df}button,select{font:inherit;background:#244b83;border:1px solid #6387be;color:white;padding:8px 14px;border-radius:6px;cursor:pointer}input{flex:1}.stage{position:relative;aspect-ratio:16/9;background:#eff4ff;margin:18px 0;overflow:hidden;border-radius:8px;color:#152a46;container-type:inline-size}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.context{position:absolute;left:13%;top:0;height:7.6%;right:0;background:linear-gradient(105deg,#f6f8ff,#e9effc);display:flex;align-items:center;padding:0 2%;font-size:1.42cqw;font-weight:600;border-bottom:1px solid #dce4f4;white-space:nowrap}.veil{position:absolute;inset:7.6% 0 0;background:#edf2faad;display:grid;place-items:center;backdrop-filter:blur(2px)}.dialog{width:49%;background:#fff;border:1px solid #acbfdf;box-shadow:0 18px 45px #24416533;border-radius:12px;padding:2.5%;font-size:1.65cqw}.dialog h2{font-size:2cqw;margin:0 0 4%}.file{padding:4%;background:#f1f6ff;border:1px solid #becfed;border-radius:6px;font-weight:600}.dialog footer{text-align:right;margin-top:5%}.ui-button{display:inline-block;background:linear-gradient(135deg,#2687ff,#4630ed);padding:2.5% 7%;border-radius:6px;color:white;font-weight:600}.busy{display:flex;align-items:center;gap:18px;font-size:1.8cqw}.spin{width:28px;height:28px;border:3px solid #d9e5ff;border-top-color:#346cff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tick,.enable{position:absolute;display:grid;place-items:center;background:linear-gradient(135deg,#2586ff,#4630ef);color:white;border-radius:5px;font-weight:600}.tick{font-size:1.65cqw}.enable{font-size:1.65cqw;box-shadow:0 3px 8px #284da330}.pointer{position:absolute;width:2.4%;filter:drop-shadow(0 1px 2px #17314b88);z-index:7;transform:translate(-20%,-10%)}.ring{position:absolute;border:3px solid #2978ff;border-radius:50%;width:3.6%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:6}.evidence{position:absolute;inset:0;padding:3%;background:linear-gradient(120deg,#eef5ff,#f5f2fc);display:flex;gap:3%;padding-bottom:9%}.source{width:34%;font-size:1.8cqw}.source h2{font-size:2.1cqw;margin:0 0 7%}.source pre{white-space:pre-wrap;font:inherit;line-height:1.7;background:white;border:1px solid #c4d4ed;border-radius:8px;padding:6%;margin:0}.evidence svg{width:63%;height:100%;background:#edf4fc;border:1px solid #c4d4ed;border-radius:8px}.evidence-foot{position:absolute;left:3%;right:3%;bottom:3%;padding:1% 2%;background:white;border:1px solid #c3d3eb;border-radius:8px;font-size:1.6cqw;font-weight:600}.pair{display:flex;gap:2%;width:100%}.pair>section{width:49%;display:flex;flex-direction:column;gap:1%}.pair h2{font-size:2cqw;margin:0}.pair svg{width:100%;flex:1}.focus{position:absolute;border:3px solid #6f61ea;box-shadow:0 0 0 999px #eef2ff55;border-radius:10px;pointer-events:none}.sub{position:absolute;bottom:1.5%;left:8%;right:8%;text-align:center;z-index:10;pointer-events:none}.sub span{display:inline-block;background:#06172bd9;color:white;padding:.2% 1.2%;font-size:2.15cqw;line-height:1.4;border-radius:5px;white-space:pre-line}.sub-safe .scene-content{position:absolute;inset:0;transform:scale(.895);transform-origin:50% 0}.scene-content{position:absolute;inset:0}.sub-safe{background:#0d1728}article{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}p{margin:10px 0}#clock{min-width:135px;font-variant-numeric:tabular-nums}#state{color:#8bd8ff}#error{color:#ffb7a7}@media(max-width:800px){article{grid-template-columns:1fr}header{display:block}nav{flex-wrap:wrap}}</style>
<main><header><div><h1>Sim2Act · 270秒制作预演</h1><small>固定图层与状态时间线 · 临时语音用于校时 · 实际H3效果另行验收</small></div><select id="scene" aria-label="选择镜头"></select></header><div class="stage" id="stage"><div id="content" class="scene-content"></div><div id="sub" class="sub"></div></div><nav><button id="play">播放</button><input id="seek" type="range" min="0" max="270" step="0.1" value="0" aria-label="时间轴"><span id="clock"></span><label><input id="subtoggle" type="checkbox" checked>字幕安全带</label></nav><p id="error"></p><article><div><p id="state"></p><p id="voice"></p></div><div><p id="asset"></p><p id="transition"></p></div></article><audio id="track" src="预演旁白_270秒.wav" preload="metadata"></audio></main>
<script>const D=__DATA__,scenes=D.scenes,subs=__SUBS__;const $=id=>document.getElementById(id);let t=0,playing=false,last=performance.now(),key='',audioReady=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+(n%60).toFixed(1).padStart(4,'0');const asset=n=>'参考图/'+encodeURIComponent(n);const rect=r=>`left:${r[0]*100}%;top:${r[1]*100}%;width:${r[2]*100}%;height:${r[3]*100}%`;function crop(name,c){const dim=D.asset_dimensions[name];return `<svg viewBox="${c.join(' ')}" preserveAspectRatio="xMinYMin meet"><defs><clipPath id="clip${name.replace(/[^a-z0-9]/gi,'')}"><rect x="${c[0]}" y="${c[1]}" width="${c[2]}" height="${c[3]}"/></clipPath></defs><image clip-path="url(#clip${name.replace(/[^a-z0-9]/gi,'')})" href="${asset(name)}" width="${dim[0]}" height="${dim[1]}"/></svg>`}scenes.forEach(s=>{const o=document.createElement('option');o.value=s.start;o.textContent=s.id+' · '+stamp(s.start);$('scene').append(o)});
function renderFrame(s,f){let h='';if(f.compare){h='<div class="evidence"><div class="pair">'+f.compare.map(x=>`<section><h2>${esc(x.title)}</h2><p style="font-size:1.8cqw;margin:0;font-weight:600">${esc(x.quote||'')}</p>${crop(x.asset,x.crop)}</section>`).join('')+`</div><div class="evidence-foot">${esc(f.note)}</div></div>`;}else if(f.evidence){h=`<div class="evidence"><section class="source"><h2>${esc(f.evidence.title)}</h2><pre>${esc(f.evidence.text)}</pre></section>${crop(f.asset,f.evidence.crop)}<div class="evidence-foot">${esc(f.evidence.note)}</div></div>`;}else{h=`<img class="photo" src="${asset(f.asset)}" alt="${esc(f.state)}">`;const isUI=!/^A12_|A01_工作|E_|ARCH-|T[1-4]-/.test(f.asset);if(isUI){const context=f.context||(f.asset.startsWith('A07_')?'任务 · 申报材料核查':s.context);h+=`<div class="context">工作区　星桥研究团队　›　${esc(context)}</div>`;}}
const o=f.overlay;if(o?.type==='notice')h+=`<div class="veil"><div class="dialog"><h2>${esc(o.title)}</h2><div class="file">${esc(o.text)}</div><footer><span class="ui-button">${esc(o.button)}</span></footer></div></div>`;if(o?.type==='busy')h+=`<div class="veil"><div class="dialog busy"><span class="spin"></span>${esc(o.text)}</div></div>`;if(o?.type==='filepicker'||o?.type==='file_added')h+=`<div class="veil"><div class="dialog"><h2>${o.type==='filepicker'?'添加附件':'附件已加入本次材料'}</h2><div class="file">${esc(o.file)}</div><footer><span class="ui-button">${o.type==='filepicker'?'确认添加':'重新检查'}</span></footer></div></div>`;if(o?.type==='consent')h+=`<div class="tick" style="${rect(o.checkbox)}">✓</div><div class="enable" style="${rect(o.button)}">${esc(o.button_text)}</div>`;if(o?.type==='focus')h+=`<div class="focus" style="${rect(o.rect)}"></div>`;return h;}
function draw(){const s=scenes[Math.min(26,Math.floor(t/10))],local=t-s.start,f=[...s.frames].reverse().find(f=>f.at<=local);const k=s.id+':'+f.at;if(k!==key){key=k;$('content').innerHTML=renderFrame(s,f)}$('content').querySelectorAll('.pointer,.ring').forEach(e=>e.remove());for(const c of s.clicks){const dt=local-c.at;if(dt>=-.5&&dt<=.55){$('content').insertAdjacentHTML('beforeend',`<svg class="pointer" viewBox="0 0 32 40" style="left:${c.x*100}%;top:${c.y*100}%"><path d="M3 2L3 30L11 24L17 37L23 34L17 22L28 22Z" fill="white" stroke="#183454" stroke-width="2"/></svg>`);if(dt>=0)$('content').insertAdjacentHTML('beforeend',`<div class="ring" style="left:${c.x*100}%;top:${c.y*100}%;opacity:${1-dt/.55}"></div>`)}}const sub=subs.find(x=>x.start<=t&&t<x.end);$('stage').classList.toggle('sub-safe',$('subtoggle').checked);$('sub').innerHTML=$('subtoggle').checked&&sub?'<span>'+esc(sub.lines.join('\n'))+'</span>':'';$('clock').textContent=stamp(t)+' / 04:30.0';$('seek').value=t;$('scene').value=s.start;$('state').textContent=s.id+' · '+f.state;$('voice').textContent=s.narration;$('asset').textContent=f.asset;$('transition').textContent=s.transition;$('play').textContent=playing?'暂停':'播放';window.currentState={scene:s.id,local,state:f.state,asset:f.asset,overlay:f.overlay?.type||null,subtitle:sub?.text||null};}
function seek(v){t=v;if(audioReady)$('track').currentTime=t;draw()}$('seek').oninput=e=>seek(Number(e.target.value));$('scene').onchange=e=>seek(Number(e.target.value));$('subtoggle').onchange=draw;$('play').onclick=async()=>{if(t>=270)t=0;playing=!playing;if(audioReady){$('track').currentTime=t;if(playing)try{await $('track').play()}catch(e){playing=false;$('error').textContent=e.message}else $('track').pause()}last=performance.now();draw()};$('track').onloadedmetadata=()=>{audioReady=true};$('track').onerror=()=>{$('error').textContent='临时音频未加载，仍可使用无声时间线。';audioReady=false};if(location.protocol.startsWith('http'))fetch('预演旁白_270秒.wav').then(r=>{if(!r.ok)throw new Error('no audio');return r.blob()}).then(b=>{$('track').src=URL.createObjectURL(b);$('track').load()}).catch(()=>{});function tick(now){if(playing){t=Math.min(270,audioReady?$('track').currentTime:t+(now-last)/1000);if(t>=269.99||(audioReady&&$('track').ended)){t=270;playing=false;$('track').pause()}draw()}last=now;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
